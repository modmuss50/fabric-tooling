plugins {
	id "java-library"
	id "fabric-java-8"
	id "fabric-java-formatting"
	id "fabric-java-publishing"
	id "fabric-junit"
	id "fabric-versioning"
}

version = "0.1.0"

def java25SourceSet = sourceSets.create("java25")
def jmhSourceSet = sourceSets.create("jmh")

configurations {
	java25Implementation.extendsFrom implementation
	java25CompileOnly.extendsFrom compileOnly
	java25RuntimeOnly.extendsFrom runtimeOnly
	java25AnnotationProcessor.extendsFrom annotationProcessor

	jmhImplementation.extendsFrom implementation
	jmhCompileOnly.extendsFrom compileOnly
	jmhRuntimeOnly.extendsFrom runtimeOnly
	jmhAnnotationProcessor.extendsFrom annotationProcessor
}

java25SourceSet.java.srcDir("src/java25/java")
java25SourceSet.resources.srcDir("src/java25/resources")
java25SourceSet.compileClasspath += sourceSets.main.output

jmhSourceSet.java.srcDir("src/jmh/java")
jmhSourceSet.resources.srcDir("src/jmh/resources")
jmhSourceSet.compileClasspath = files(java25SourceSet.output, sourceSets.main.output) + jmhSourceSet.compileClasspath
jmhSourceSet.runtimeClasspath = files(java25SourceSet.output, sourceSets.main.output) + jmhSourceSet.runtimeClasspath

sourceSets.test.compileClasspath = files(java25SourceSet.output, sourceSets.main.output) + sourceSets.test.compileClasspath
sourceSets.test.runtimeClasspath = files(java25SourceSet.output, sourceSets.main.output) + sourceSets.test.runtimeClasspath

dependencies {
	compileOnly "org.jetbrains:annotations:26.0.2"
	jmhImplementation "org.openjdk.jmh:jmh-core:1.37"
	jmhAnnotationProcessor "org.openjdk.jmh:jmh-generator-annprocess:1.37"
}

tasks.named("compileJava25Java", JavaCompile) {
	options.release = 25
}

tasks.named("compileTestJava", JavaCompile) {
	options.release = 25
}

tasks.named("compileJmhJava", JavaCompile) {
	options.release = 25
}

tasks.named("check") {
	dependsOn tasks.named("jmhClasses")
}

tasks.named("jar") {
	dependsOn tasks.named("java25Classes")
	manifest.attributes("Multi-Release": "true")

	into("META-INF/versions/25") {
		from java25SourceSet.output
	}
}

tasks.register("jmh", JavaExec) {
	group = "benchmark"
	description = "Runs the fabric-zip JMH benchmarks."
	dependsOn tasks.named("jmhClasses")
	classpath = jmhSourceSet.runtimeClasspath
	mainClass = "org.openjdk.jmh.Main"
}
